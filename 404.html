  p { color:var(--muted); font-size:clamp(17px,2vw,20px); margin:22px auto 34px; max-width:26em; animation:fadeUp 800ms var(--out) 760ms both; }
  a { display:inline-flex; align-items:center; min-height:52px; padding:14px 26px; border-radius:999px; border:2px solid var(--ink); background:var(--blue); color:var(--ink); font-weight:800; font-size:17px; text-decoration:none; box-shadow:0 4px 0 var(--ink); transition:transform 420ms var(--out), box-shadow 420ms var(--out); animation:fadeUp 800ms var(--out) 860ms both; }

  a:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); transition-duration:120ms; }
  a:focus-visible { outline:3px solid var(--ink); outline-offset:4px; }
  @keyframes stamp {
    0%   { opacity:0; transform:scale(1.7) rotate(-16deg); animation-timing-function:cubic-bezier(.55,0,.85,.35); }
    18%  { opacity:1; }
    52%  { transform:scale(0.93) rotate(1.5deg); animation-timing-function:cubic-bezier(.2,.9,.3,1); }
    70%  { transform:scale(1.025) rotate(-0.6deg); }
    100% { opacity:1; transform:none; }
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition-duration:0.01ms !important; } }
